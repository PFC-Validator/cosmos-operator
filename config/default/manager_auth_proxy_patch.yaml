# Serves /metrics from the manager itself over HTTPS, with authentication and authorization handled
# by controller-runtime's built-in filters.
#
# This replaces the kube-rbac-proxy sidecar, which is unmaintained and was pinned to a four year old
# image. Protection is equivalent: callers still need create on tokenreviews and subjectaccessreviews
# via proxy-role, which is already bound to this service account.
#
# To expose /metrics with no authn/z, drop this patch from kustomization.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
spec:
  template:
    spec:
      containers:
      - name: manager
        args:
        - "--health-probe-bind-address=:8081"
        - "--metrics-bind-address=:8443"
        - "--metrics-secure"
        - "--leader-elect"
        ports:
        - containerPort: 8443
          protocol: TCP
          name: https
