# Exposes the manager's own HTTPS metrics endpoint. The port named "https" is defined on the
# manager container by config/default/manager_auth_proxy_patch.yaml.
apiVersion: v1
kind: Service
metadata:
  labels:
    control-plane: controller-manager
  name: controller-manager-metrics-service
spec:
  ports:
  - name: https
    port: 8443
    protocol: TCP
    targetPort: https
  selector:
    control-plane: controller-manager
